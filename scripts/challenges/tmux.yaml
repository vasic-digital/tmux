      M-MouseDrag1Pane override survives mouse_any_flag=1
      surface; T5 OS clipboard carries all 6 markers (physical
      proof).
    evidence: |
      `list-keys -T root M-MouseDrag1Pane` mentions copy-mode;
      `list-keys -T root S-MouseDrag1Pane` mentions copy-mode;
      `list-keys -T copy-mode-vi M-MouseDragEnd1Pane` references
      copy-pipe-and-cancel + @clip; same for S-MouseDragEnd1Pane;
