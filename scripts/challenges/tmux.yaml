  - id: TMUX-CH-27
    title: tmx_non_tty_safety — non-TTY stdin silent-skips fast (P2 + P6)
    description: |
      Per v1.0.9 design spec G2 + §6 edge case 5: tmx-shell-init.sh
      MUST detect non-interactive stdin (scp, rsync, IDE pipes, cron)
      and return 0 immediately WITHOUT printing the prompt and
      WITHOUT blocking on `read`. Pre-fix snippets `read`-blocked
      non-interactive shells and broke `scp`. Dispatches to test 30
      (scripts/tests/30_non_tty_skip.sh) which (a) seeds the init
      script from the template, (b) runs it under `timeout 5` with
      stdin from /dev/null, (c) asserts elapsed_ms < 2000 (POSITIVE
      evidence per §11.4.5 — must be FAR under the 5s ceiling stated
      in the contract), (d) asserts the prompt string was NOT printed
      to stdout, (e) asserts no tmx session was created.
      §11.4.50 reliability: 3 iterations, identical evidence-hash.
      Paired mutation P5-M20 strips the `[ -t 0 ]` guard — when the
      guard is gone, the script prints the prompt and blocks on
      `read </dev/null`, exit code = 124 (timeout fired), so this
      Challenge MUST FAIL.
    test_script: scripts/tests/30_non_tty_skip.sh
    pass_condition: |
      Test exit 0 AND stdout contains `[evidence] ... elapsed_ms=<N>`
      with N < 2000 (well under the spec's 5000ms ceiling) per
      iteration AND `rc=0 no_prompt=yes no_session=yes` AND no
      `Enter session name` substring in captured stdout; 3/3
      reliability iterations identical evidence-hash per §11.4.50.
    skip_conditions: |
      §11.4.3 topology dispatch: SKIP-77 if scripts/tmx-shell-init.sh.template
      not present (P2 not landed yet), OR if HOST_OS is neither
      Linux nor Darwin.
    evidence: |
      stdout `[evidence]` lines per iteration with elapsed_ms + rc
      + no_prompt + no_session flags; platform_note for per-OS
      branch coverage (§11.4.81); reliability_hash on final line.
    mutation_targets: P5-M20 (strip non-TTY guard from tmx-shell-init.sh)
    severity: critical

  - id: TMUX-CH-28
    title: tmx_docs_user_guides_render — operator + manual docs ship HTML+PDF (P8)
    description: |
      Per v1.0.9 design spec §8 documentation deliverables + §11.4.65
      universal Markdown export: the four operator-facing
      documentation paths (3 guides + 1 manual) MUST exist as .md AND
      have valid .html + .pdf siblings whose mtime is ≥ the .md
      mtime (sync invariant). This is the autonomous render gate —
      it PASSes only when all four paths have all three formats AND
      the sibling mtimes are not stale. POSITIVE evidence per §11.4.5
      = stat output for each file triple. §11.4.50 reliability: a
      file-mtime check is by construction deterministic; the
      Challenge runner SHOULD invoke 3 times and assert identical
      verdict (no flake possible if filesystem is consistent).
      Required paths (relative to project root):
        - docs/guides/tmx-shell-integration.md
        - docs/guides/tmx-state.md
        - docs/guides/tmx-ssh-dispatch.md
        - docs/manual/tmx-shell-integration.md
      Until P8 lands the docs do not exist yet — this Challenge
      SKIPs with reason "P8 not landed". After v1.0.9 release the
      Challenge becomes STRICT (any missing file or stale sibling
      mtime FAILs).
      RUNTIME DRIVER NOTE: this Challenge dispatches to a
      dedicated render-check driver script that P8 MUST land
      alongside the docs themselves. Until P8 lands the driver,
      the harness SKIPs per §11.4.3 with the "test script not yet
      present" reason — NEVER PASS-by-default.
    test_script: scripts/tests/41_docs_user_guides_render.sh
    pass_condition: |
      For each of the 4 required paths: .md exists AND .html exists
      AND .pdf exists AND .html mtime ≥ .md mtime AND .pdf mtime ≥
      .md mtime AND .html size > 0 AND .pdf size > 0. Captured stat
      output for each file triple printed as `[evidence] path=<p>
      md=<ts> html=<ts> pdf=<ts> html_size=<N> pdf_size=<N>` lines.
      Driver invokes the check 3 times and asserts identical
      verdict per §11.4.50.
    skip_conditions: |
      §11.4.3 topology dispatch: SKIP-77 if test_script
      scripts/tests/41_docs_user_guides_render.sh is not yet
      present (P8 not landed), OR if ANY of the 4 required .md
      files is missing (P8 not yet landed — strict after v1.0.9
      release tag, until then SKIP-with-reason citing the missing
      path). NEVER PASS-by-default when files are absent.
    evidence: |
      Per-file `[evidence]` line with path + md/html/pdf mtimes +
      html/pdf byte sizes; final reliability_hash line.
    mutation_targets: |
      P5 mutation pair (TBD when P8 lands): backdate one .html sibling
      (touch -t old) and assert this Challenge FAILs with stale-sibling
      evidence; OR remove one .pdf sibling and assert FAIL with
      missing-sibling evidence.
    severity: blocker


  - id: TMUX-CH-44
    title: clipboard copy-OUT physical end-user proof (operator-path)
    description: |
      The operator MUST be able to copy text from a tmx session into
      their system clipboard, using either the keyboard ('y' in
      copy-mode-vi, or Enter) or the mouse (drag-end). The bindings
      live in scripts/tmux.conf.template (@clip user option +
      copy-pipe-and-cancel "#{@clip}" on y / Enter / MouseDragEnd1Pane).
      Until test 44 landed, no test PROVED a single byte ever reached
      the system clipboard — a §101 PASS-bluff risk for a feature an
      operator uses every minute. This Challenge closes that hole with
      physical proof: a unique marker is printed in a real tmx session,
      copied through the actual operator binding via a 'y' keystroke,
      and then read back from the OS-native clipboard tool (pbpaste on
      Darwin; wl-paste / xclip -o on Linux with Wayland/X11;
      termux-clipboard-get on Termux). On a headless server with no
      clipboard tool, T5 honestly SKIPs while T3/T4 still PROVE the
      binding chain via tmux's own buffer.
    test_script: scripts/tests/44_clipboard_copy_out_physical.sh
    pass_condition: |
      FAIL=0. T1 conf-template carries @clip + the three bindings;
      T2.1+T2.2 live `list-keys -T copy-mode-vi` show y and
      MouseDragEnd1Pane routing through copy-pipe-and-cancel "#{@clip}";
      T3 direct -X copy-pipe puts the marker into tmux's own buffer
      (binding chain proven); T4 sending the literal 'y' key in
      copy-mode triggers the binding and puts the marker into the
      buffer (bind table dispatch proven); T5 the OS-native paste tool
      returns the marker (physical end-user proof) — or honestly SKIPs
      with reason where no clipboard tool is reachable.
    evidence: |
      live `tmux -L tmx-NAME list-keys -T copy-mode-vi y` output;
      `show-buffer` content after the binding fires (T3 + T4);
      `pbpaste` / `wl-paste -n` / `xclip -o -selection clipboard` /
      `termux-clipboard-get` output (T5) — the physical clipboard
      readback proves the operator's external paste would receive
      the text. Cleanup: operator's prior clipboard is captured
      pre-test and restored at exit so the test never clobbers it.
    skip_conditions: |
      §11.4.3 topology: T5 (system clipboard) SKIPs with reason on
      headless Linux servers with no DISPLAY/Wayland/Termux clipboard
      tool — T3/T4 binding-chain proof still runs and asserts. The
      whole test SKIPs only if the tmux binary or tmx wrapper is
      absent (i.e. setup.sh not yet run).
    mutation_targets: |
      M-CLIP: replace the @clip value with `cat >/dev/null` (silent
      drop) and assert tests T3/T4 FAIL (tmux buffer does not carry
      the marker). FEATURE RESTORED via the harness backup. Lives in
      meta_test_false_positive_proof.sh.
    severity: blocker

  - id: TMUX-CH-45
    title: MULTI-LINE copy physical end-user proof (operator-path)
    description: |
