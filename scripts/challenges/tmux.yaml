  - id: TMUX-CH-46
    title: PASTE-INTO from OS clipboard physical end-user proof
    description: |
      The operator MUST be able to paste OS-clipboard contents INTO
      a tmx pane via a tmux keystroke. v1.0.14's `set-clipboard
      external` is COPY-OUT only — OSC-52 paste is not standardised.
      v1.0.15 adds `@clip-read` (OS-adaptive read — pbpaste /
      wl-paste -n / xclip -o / termux-clipboard-get) + `prefix + P`
      that pipes the clipboard through `load-buffer -` then
      `paste-buffer -p`. This Challenge proves the flow end-to-end
      with physical evidence — a unique marker seeded via pbcopy
      lands in the pane after invoking the binding mechanism.
    test_script: scripts/tests/46_paste_in_physical.sh
    pass_condition: |
      FAIL=0. T1 conf-template carries @clip-read + prefix+P
      bindings; T2 live readback of both confirm they exist;
      T3 the marker seeded in the OS clipboard reaches the pane
      via the binding mechanism (physical proof); T4 the prefix+P
      bind body references @clip-read.
    evidence: |
      `tmux capture-pane -p -S -` output after the binding fires
      contains the seeded marker; live `list-keys -T prefix P`
      shows a paste-buffer-bearing command body referencing
      @clip-read; live `show-options -gv @clip-read` returns the
      non-empty OS-adaptive read command.
    skip_conditions: |
      §11.4.3 topology: T3 SKIPs honestly when no OS clipboard
      tool is reachable; T1/T2 binding-presence assertions still
      run. Whole test SKIPs only if binary or wrapper absent.
    mutation_targets: |
      M46 (meta_test_false_positive_proof.sh): strip the
      `@clip-read` user-option definition from the template;
      assert test 46 FAILs at T1 (and at T2.1 + T3 on hosts with
      a clipboard tool). FEATURE RESTORED via harness backup.
    severity: blocker

  - id: TMUX-CH-47
    title: Scroll inside alt-screen + mouse-tracking TUI (Claude Code-like)
    description: |
      The operator MUST be able to scroll vertically inside any
      TUI app — vim, less, htop, AND Claude Code — even when the
      app has alternate-screen + mouse-tracking enabled. tmux's
      default WheelUpPane would forward the wheel to the app
      (because `#{mouse_any_flag}`=1); v1.0.3's WheelUp override
      drives copy-mode unconditionally. This Challenge proves the
      override survives the hostile environment by spawning a
      synthetic alt-screen+mouse-tracking surrogate
      (helpers/synthetic_alt_screen_app.py) and confirming
      `pane_in_mode` engages on a WheelUp scroll-up action.
    test_script: scripts/tests/47_alt_screen_scroll.sh
    pass_condition: |
      FAIL=0. T1 helper script compiles; T2 conf-template carries
      WheelUpPane override; T3 synthetic helper launches +
      READY-marker captured; T4 pane alternate_on=1 +
      mouse_any_flag=1 (hostile surface confirmed); T5
      copy-mode engages on WheelUp scroll-up action; T6 live
      WheelUpPane binding is the override (not the
      mouse_any_flag-respecting default).
    evidence: |
      `display-message -p '#{alternate_on}'` = 1;
      `display-message -p '#{mouse_any_flag}'` = 1;
      `display-message -p '#{pane_in_mode}'` = 1 after scroll-up;
      `list-keys -T root WheelUpPane` mentions copy-mode + scroll-up
      AND not mouse_any_flag.
    skip_conditions: |
      SKIP if python3 is not on PATH (synthetic helper cannot
      launch); SKIP if helper script absent. Whole test SKIPs
      only if binary or wrapper absent.
    mutation_targets: |
      Coverage by composition: M12 (WheelUp override) catches
      regressions in the binding the test depends on. Removing
      the synthetic helper script triggers T0 SKIP (helper
      absent) — not catchable as a feature regression but tracked
      as Layer-1 verify.sh gate.
    severity: critical

  - id: TMUX-CH-48
    title: Alt-drag + Shift-drag override for selection in mouse-tracking TUI
    description: |
      Inside Claude Code (mouse_any_flag=1), tmux's default
