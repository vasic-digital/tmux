# HelixQA Challenges for the vasic-digital optimized tmux build.
# Each Challenge is a one-line condition the test harness verifies.
# These mirror scripts/tests/0[1-8]_*.sh but carry §11.4 captured-evidence
# semantics — the Challenge passes only when the runtime evidence is observed,
# not when the test exited 0.

challenges:
  - id: TMUX-CH-01
    title: tmux binary smoke test
    description: tmux from the vasic-digital build reports the expected version.
    prerequisite: tmux/build/bin/tmux is executable
    test_script: scripts/tests/01_smoke.sh
    pass_condition: |
      stdout contains "tmux 3.6a"
    evidence: stdout transcript
    severity: blocker

  - id: TMUX-CH-02
    title: tmux session lifecycle
    description: new-session, list-sessions, kill-server work end-to-end.
    test_script: scripts/tests/02_session.sh
    pass_condition: |
      session is listed AND kill-server returns clean
    evidence: stdout transcript + ps shows no orphaned tmux server
    severity: blocker

  - id: TMUX-CH-03
    title: jemalloc loaded via LD_PRELOAD
    description: |
      The wrapper script's LD_PRELOAD actually engages — running tmux
      server process has libjemalloc.so mapped in /proc/<pid>/maps.
    test_script: scripts/tests/03_jemalloc_loaded.sh
    pass_condition: |
      grep "jemalloc" /proc/<server-pid>/maps returns a match
    evidence: /proc/PID/maps grep output
    severity: critical

  - id: TMUX-CH-04
    title: history-limit configuration honored
    description: A user-configured history-limit overrides the default.
    test_script: scripts/tests/04_history_limit.sh
    pass_condition: |
      tmux show-options -g history-limit returns the configured value
    evidence: tmux command output
    severity: high

  - id: TMUX-CH-05
    title: clear-history releases memory (the "apparent leak" check)
    description: |
      Fill scrollback to ~50000 lines, measure tmux server RSS, run
      clear-history, measure again. RSS must drop meaningfully.
    test_script: scripts/tests/05_clear_history_releases.sh
    pass_condition: |
      RSS_after / RSS_peak <= 0.95  OR  drop >= 5 MB  OR  drop >= 1 MB (jemalloc-tolerant)
    evidence: VmRSS deltas from /proc/PID/status
    severity: critical

  - id: TMUX-CH-06
    title: 10 concurrent panes — RSS bounded
    description: Spawning 10 panes does not blow up server RSS.
    test_script: scripts/tests/06_concurrent_panes.sh
    pass_condition: |
      delta_RSS < 20 MB
    evidence: VmRSS before/after delta
    severity: high

  - id: TMUX-CH-07
    title: 30-second sustained session
    description: Server RSS does not grow unboundedly during sustained activity.
    test_script: scripts/tests/07_long_session.sh
    pass_condition: |
      growth in 25 s < 50% of T+5s baseline
    evidence: VmRSS time-series
    severity: critical

  - id: TMUX-CH-08
    title: wrapper applies oom_score_adj=-500
    description: |
      The tmx wrapper script successfully applies
      oom_score_adj=-500 to the tmux server it spawns. This is the
      single most impactful protection against §12 host-distress events
      cascading into operator session loss.
    test_script: scripts/tests/08_oom_score_adj.sh
    pass_condition: |
      cat /proc/<server-pid>/oom_score_adj  ==  "-500"
    evidence: /proc/PID/oom_score_adj reading
    severity: blocker

  - id: TMUX-CH-09
    title: crash isolation scope — cgroup invariants
    description: |
      The tmx wrapper's systemd-run --user --scope mechanism enforces
      memory/cpu caps AND survives SIGKILL without taking user.slice down.
      Verifies T1 (host capability), T2 (wrapper invariants), T3 (cgroup
      readback), T4 (SIGKILL containment + user.slice survival), T6
      (concurrent scopes independent).
    test_script: scripts/tests/09_crash_isolation_scope.sh
    pass_condition: |
      PASS >= 8  FAIL = 0  (T1: systemd 230+, cgroup v2; T2: wrapper
      has MemoryMax/CPUQuota/TasksMax/Delegate; T3: memory.max + cpu.max
      readback from /sys/fs/cgroup; T4: SIGKILL kills scope but not
      default.target; T6: 3 concurrent scopes all active)
    evidence: |
      /sys/fs/cgroup/.../memory.max content = configured MemoryMax;
      /sys/fs/cgroup/.../cpu.max content present;
      systemctl --user is-active default.target = active THROUGHOUT
    severity: blocker

  - id: TMUX-CH-12
    title: memory pressure under cgroup cap (T5)
    description: |
      Allocate inside the scope up to MemoryMax+10%, verify the kernel
      OOM-kills only the scope process, verify user.slice survives.
      Destructive test — requires TMX_TEST_DESTRUCTIVE=1.
    test_script: scripts/tests/12_memory_pressure_under_cap.sh
    pass_condition: |
      dmesg shows oom-kill for a PID inside the scope's cgroup;
      systemctl --user is-active default.target reads active after kill
    evidence: dmesg oom-kill line + default.target=active after
    severity: blocker

  - id: TMUX-CH-13
    title: TasksMax fork-bomb resistance (T7)
    description: |
      Spawn processes inside the scope until TasksMax=4096 is hit.
      Verify pids.current == pids.max and no processes leak outside.
      Destructive test — requires TMX_TEST_DESTRUCTIVE=1.
    test_script: scripts/tests/13_tasksmax_stress.sh
    pass_condition: |
      pids.current == pids.max == 4096; no processes escape the scope
    evidence: /sys/fs/cgroup/.../pids.current + pids.max readback
    severity: high

  - id: TMUX-CH-14
    title: concurrent OOM independence via the OPERATOR PATH (T8)
    description: |
      Three sessions A/B/C created via `tmx new -s NAME -d` — the same
      entry point an operator invokes. Trigger OOM in A via `tmx send-keys`
      + stress-ng; verify B and C remain active with original MainPIDs.
      Per Constitution §11.4.7 (operator-path coverage rule): this
      challenge tests the OPERATOR's wrapper invocation, NOT hand-crafted
      systemd-run scopes. Destructive test.
    test_script: scripts/tests/14_concurrent_oom_independence.sh
    pass_condition: |
      Only scope A is killed; B and C remain active with unchanged
      MainPIDs; default.target=active throughout
    evidence: |
      systemctl --user list-units showing B+C active;
      cgroup.procs in B+C unchanged after A's OOM;
      kernel log (dmesg / journalctl -k) shows oom-kill / cgroup OOM
    severity: blocker

  - id: TMUX-CH-15
    title: per-session cgroup distinctness (operator-path)
    description: |
      Multiple `tmx new -s NAME -d` invocations MUST each produce a
      distinct cgroup-v2 transient scope `tmx-NAME.scope`, with its
      own MemoryMax / CPUQuota / TasksMax. Closes the Fixed.md A12
      bluff where all sessions shared one scope (operator-facing
      isolation claim was false). Tests the OPERATOR PATH per §11.4.7.
    test_script: scripts/tests/15_per_session_cgroup_distinct.sh
    pass_condition: |
      PASS=6  FAIL=0  (T1 two distinct scopes active; T2 cgroup paths
      differ with their own pids; T3 memory.max readback ≥2GB floor;
      T4 cpu.max present; T5 TMX_MEM=3G override = 3 GiB exactly;
      T6 unit names operator-targetable as tmx-NAME.scope)
    evidence: |
      systemctl --user is-active per scope = active for each;
      /sys/fs/cgroup/.../memory.max readback per scope;
      /sys/fs/cgroup/.../cpu.max readback per scope;
      /sys/fs/cgroup/.../cgroup.procs distinct PID sets
    severity: blocker

  - id: TMUX-CH-10
    title: hostname→color algorithm — deterministic palette mapping
    description: |
      The hostname_color.sh script maps any hostname to a deterministic
      tmux 256-colour from a curated palette. Same hostname always
      produces the same colour. Different hostnames produce varied colours.
    test_script: scripts/tests/10_hostname_color_algorithm.sh
    pass_condition: |
      PASS=5  FAIL=0  (all 5 invariants: deterministic, valid colourNNN,
      palette member, spread ≥12/16, empty-fallback to system hostname)
    evidence: stdout transcript with hash + palette-index + colour
    severity: high

  - id: TMUX-CH-11
    title: hostname colour applied to tmux status-bg via wrapper
    description: |
      The tmx wrapper computes the hostname-derived colour and applies
      it as status-style bg on the running tmux server. The colour
      persists across sessions.
    test_script: scripts/tests/11_hostname_color_integration.sh
    pass_condition: |
      tmx wrapper contains _apply_host_color + hostname_color.sh ref;
      status-style bg matches expected hostname colour on first and
      subsequent sessions
    evidence: 'show -g status-style' output matched to hostname_color.sh result
    severity: high

  - id: TMUX-CH-16
    title: window-name strips `.exe` suffix (operator-path)
    description: |
      Some bundled CLIs ship Mach-O binaries literally named `*.exe`
      (notably Claude Code v2.x at
      `lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe`). The
      kernel `comm` field carries the basename, so tmux's
      `#{pane_current_command}` reports `claude.exe`, which the default
      `automatic-rename-format` propagates into the window name shown
      in the bottom-left status bar — operators saw `[session] N:claude.exe`.
      The fix patches `scripts/tmux.conf.template` to strip a literal
      `.exe` tail from the rename format. Tested via the OPERATOR PATH
      (`tmx new -s NAME` + an in-test `.exe` binary), per §11.4.7. A
      regression guard binary `t16_bashexe` (no dot, but containing
      `exe`) MUST survive unmodified — preventing the unescaped-dot
      bug class from shipping silently.
    test_script: scripts/tests/16_window_name_strips_exe.sh
    pass_condition: |
      PASS=6  FAIL=0  (T1 conf-template carries literal-dot-anchored
      `\\.exe$`; T2.0 operator-path session A created; T2.1
      pane_current_command observed as `t16_target.exe`; T2.2 #W
      has .exe stripped; T3.0 session B created; T3.1 regression
      guard `t16_bashexe` preserved as-is)
    evidence: |
      live `tmux -L tmx-NAME display-message -p '#W'` reads from
      both sessions; positive proof pane_current_command had the
      `.exe` form (defect surface reachable); strip applied to
      the `.exe` case only.
    severity: high

  - id: TMUX-CH-17
    title: scrollback + copy-mode scrolling works (operator-path)
    description: |
      Operators reported that scrolling terminal output up/down — in
      particular inside the Claude Code TUI — did not work. Two root
      causes: the history-limit default (2000) was too small, and tmux's
      default WheelUpPane binding forwards the wheel to mouse-reporting
      apps (Claude Code, vim, less) instead of scrolling tmux's own
      scrollback. The fix (Fixed.md A16) bumps history-limit to 50000,
      sets mode-keys vi, overrides WheelUp/WheelDown so the wheel ALWAYS
      drives copy-mode scrollback, and adds the Claude Code passthrough
      settings (allow-passthrough on, extended-keys on,
      terminal-features extkeys). Verified via the OPERATOR PATH
      (`tmx new -s NAME`) per Constitution §102: a 3000-line stream is
      generated (deliberately > the old 2000 default, < the new 50000),
      the first line is proven to have scrolled off the visible screen,
      then the operator is proven able to scroll back to it via
      copy-mode and copy it.
    test_script: scripts/tests/17_scrollback_copy_mode.sh
    pass_condition: |
      FAIL=0. T1 conf-template carries all six scroll settings; T2 reads
      back history-limit=50000 / mode-keys=vi / mouse=on /
      allow-passthrough=on / extended-keys=on from the LIVE server;
      T3 confirms the live WheelUpPane binding drives copy-mode scroll-up
      (override active, not tmux default); T4 generates 3000 lines,
      proves SCROLLMARK_FIRST left the visible screen (defect surface
      real), proves the scrollback buffer retained it (history-limit
      bump functional — would be evicted at the old 2000 default), and
      proves copy-mode reached + copied it.
    evidence: |
      live `tmux -L tmx-NAME show-options` readbacks; `list-keys -T root
      WheelUpPane` output; `capture-pane -p` (visible) vs `capture-pane
      -p -S -` (full history); `#{scroll_position}` after a copy-mode
      search; `show-buffer` carrying SCROLLMARK_FIRST.
    severity: high

  - id: TMUX-CH-18
    title: HelixConstitution inheritance is wired and verified
    description: |
      The project's universal governance (anti-bluff covenant, data
      safety, memory budget, continuation-document invariant) is
      inherited from the HelixConstitution submodule at `constitution/`.
      This Challenge proves the inheritance is REAL, not merely claimed:
      the submodule is present + initialized, `.gitmodules` records it
      with an SSH URL, the §11.4 End-user Quality Guarantee anchor
      physically exists in `constitution/Constitution.md`, the verbatim
      anti-bluff user mandate is present, and every project governance
      doc (Constitution.md / CLAUDE.md / AGENTS.md / QWEN.md) carries
      its inheritance pointer. The `constitution/` submodule is
      decoupled and independent — this gate READS it but never modifies
      it; the paired mutation (CM-CONSTITUTION-INHERITANCE) operates on
      a temporary copy.
    test_script: scripts/tests/18_constitution_inheritance.sh
    pass_condition: |
      FAIL=0. T1 submodule populated; T2 .gitmodules carries the
      constitution entry with an SSH URL; T2b submodule initialized;
      T3 §11.4 anchor present in constitution/Constitution.md; T4
      verbatim anti-bluff mandate present; T5–T9 project Constitution /
      CLAUDE / AGENTS / QWEN all carry inheritance pointers plus the
      §101 project anti-bluff binding.
    evidence: |
      file-content greps of constitution/Constitution.md (the exact
      §11.4 sentinel line) + .gitmodules + `git submodule status` +
      each project governance doc.
    severity: blocker
