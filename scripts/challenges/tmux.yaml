# HelixQA Challenges for the vasic-digital optimized tmux build.
# Each Challenge is a one-line condition the test harness verifies.
# These mirror scripts/tests/0[1-8]_*.sh but carry §11.4 captured-evidence
# semantics — the Challenge passes only when the runtime evidence is observed,
# not when the test exited 0.

challenges:
  - id: TMUX-CH-01
    title: tmux binary smoke test
    description: tmux from the vasic-digital build reports the expected version.
    prerequisite: tmux/build/bin/tmux is executable
    test_script: scripts/tests/01_smoke.sh
    pass_condition: |
      stdout contains "tmux 3.6a"
    evidence: stdout transcript
    severity: blocker

  - id: TMUX-CH-02
    title: tmux session lifecycle
    description: new-session, list-sessions, kill-server work end-to-end.
    test_script: scripts/tests/02_session.sh
    pass_condition: |
      session is listed AND kill-server returns clean
    evidence: stdout transcript + ps shows no orphaned tmux server
    severity: blocker

  - id: TMUX-CH-03
    title: jemalloc loaded via LD_PRELOAD
    description: |
      The wrapper script's LD_PRELOAD actually engages — running tmux
      server process has libjemalloc.so mapped in /proc/<pid>/maps.
    test_script: scripts/tests/03_jemalloc_loaded.sh
    pass_condition: |
      grep "jemalloc" /proc/<server-pid>/maps returns a match
    evidence: /proc/PID/maps grep output
    severity: critical

  - id: TMUX-CH-04
    title: history-limit configuration honored
    description: A user-configured history-limit overrides the default.
    test_script: scripts/tests/04_history_limit.sh
    pass_condition: |
      tmux show-options -g history-limit returns the configured value
    evidence: tmux command output
    severity: high

  - id: TMUX-CH-05
    title: clear-history releases memory (the "apparent leak" check)
    description: |
      Fill scrollback to ~50000 lines, measure tmux server RSS, run
      clear-history, measure again. RSS must drop meaningfully.
    test_script: scripts/tests/05_clear_history_releases.sh
    pass_condition: |
      RSS_after / RSS_peak <= 0.95  OR  drop >= 5 MB  OR  drop >= 1 MB (jemalloc-tolerant)
    evidence: VmRSS deltas from /proc/PID/status
    severity: critical

  - id: TMUX-CH-06
    title: 10 concurrent panes — RSS bounded
    description: Spawning 10 panes does not blow up server RSS.
    test_script: scripts/tests/06_concurrent_panes.sh
    pass_condition: |
      delta_RSS < 20 MB
    evidence: VmRSS before/after delta
    severity: high

  - id: TMUX-CH-07
    title: 30-second sustained session
    description: Server RSS does not grow unboundedly during sustained activity.
    test_script: scripts/tests/07_long_session.sh
    pass_condition: |
      growth in 25 s < 50% of T+5s baseline
    evidence: VmRSS time-series
    severity: critical

  - id: TMUX-CH-08
    title: wrapper applies oom_score_adj=-500
    description: |
      The tmx wrapper script successfully applies
      oom_score_adj=-500 to the tmux server it spawns. This is the
      single most impactful protection against §12 host-distress events
      cascading into operator session loss.
    test_script: scripts/tests/08_oom_score_adj.sh
    pass_condition: |
      cat /proc/<server-pid>/oom_score_adj  ==  "-500"
    evidence: /proc/PID/oom_score_adj reading
    severity: blocker

  - id: TMUX-CH-09
    title: crash isolation scope — cgroup invariants
    description: |
      The tmx wrapper's systemd-run --user --scope mechanism enforces
      memory/cpu caps AND survives SIGKILL without taking user.slice down.
      Verifies T1 (host capability), T2 (wrapper invariants), T3 (cgroup
      readback), T4 (SIGKILL containment + user.slice survival), T6
      (concurrent scopes independent).
    test_script: scripts/tests/09_crash_isolation_scope.sh
    pass_condition: |
      PASS >= 8  FAIL = 0  (T1: systemd 230+, cgroup v2; T2: wrapper
      has MemoryMax/CPUQuota/TasksMax/Delegate; T3: memory.max + cpu.max
      readback from /sys/fs/cgroup; T4: SIGKILL kills scope but not
      default.target; T6: 3 concurrent scopes all active)
    evidence: |
      /sys/fs/cgroup/.../memory.max content = configured MemoryMax;
      /sys/fs/cgroup/.../cpu.max content present;
      systemctl --user is-active default.target = active THROUGHOUT
    severity: blocker

  - id: TMUX-CH-12
    title: memory pressure under cgroup cap (T5)
    description: |
      Allocate inside the scope up to MemoryMax+10%, verify the kernel
      OOM-kills only the scope process, verify user.slice survives.
      Destructive test — requires TMX_TEST_DESTRUCTIVE=1.
    test_script: scripts/tests/12_memory_pressure_under_cap.sh
    pass_condition: |
      dmesg shows oom-kill for a PID inside the scope's cgroup;
      systemctl --user is-active default.target reads active after kill
    evidence: dmesg oom-kill line + default.target=active after
    severity: blocker

  - id: TMUX-CH-13
    title: TasksMax fork-bomb resistance (T7)
    description: |
      Spawn processes inside the scope until TasksMax=4096 is hit.
      Verify pids.current == pids.max and no processes leak outside.
      Destructive test — requires TMX_TEST_DESTRUCTIVE=1.
    test_script: scripts/tests/13_tasksmax_stress.sh
    pass_condition: |
      pids.current == pids.max == 4096; no processes escape the scope
    evidence: /sys/fs/cgroup/.../pids.current + pids.max readback
    severity: high

  - id: TMUX-CH-14
    title: concurrent OOM independence via the OPERATOR PATH (T8)
    description: |
      Three sessions A/B/C created via `tmx new -s NAME -d` — the same
      entry point an operator invokes. Trigger OOM in A via `tmx send-keys`
      + stress-ng; verify B and C remain active with original MainPIDs.
      Per Constitution §11.4.7 (operator-path coverage rule): this
      challenge tests the OPERATOR's wrapper invocation, NOT hand-crafted
      systemd-run scopes. Destructive test.
    test_script: scripts/tests/14_concurrent_oom_independence.sh
    pass_condition: |
      Only scope A is killed; B and C remain active with unchanged
      MainPIDs; default.target=active throughout
    evidence: |
      systemctl --user list-units showing B+C active;
      cgroup.procs in B+C unchanged after A's OOM;
      kernel log (dmesg / journalctl -k) shows oom-kill / cgroup OOM
    severity: blocker

  - id: TMUX-CH-15
    title: per-session cgroup distinctness (operator-path)
    description: |
      Multiple `tmx new -s NAME -d` invocations MUST each produce a
      distinct cgroup-v2 transient scope `tmx-NAME.scope`, with its
      own MemoryMax / CPUQuota / TasksMax. Closes the Fixed.md A12
      bluff where all sessions shared one scope (operator-facing
      isolation claim was false). Tests the OPERATOR PATH per §11.4.7.
    test_script: scripts/tests/15_per_session_cgroup_distinct.sh
    pass_condition: |
      PASS=6  FAIL=0  (T1 two distinct scopes active; T2 cgroup paths
      differ with their own pids; T3 memory.max readback ≥2GB floor;
      T4 cpu.max present; T5 TMX_MEM=3G override = 3 GiB exactly;
      T6 unit names operator-targetable as tmx-NAME.scope)
    evidence: |
      systemctl --user is-active per scope = active for each;
      /sys/fs/cgroup/.../memory.max readback per scope;
      /sys/fs/cgroup/.../cpu.max readback per scope;
      /sys/fs/cgroup/.../cgroup.procs distinct PID sets
    severity: blocker

  - id: TMUX-CH-10
    title: hostname→color algorithm — deterministic palette mapping
    description: |
      The hostname_color.sh script maps any hostname to a deterministic
      tmux 256-colour from a curated palette. Same hostname always
      produces the same colour. Different hostnames produce varied colours.
    test_script: scripts/tests/10_hostname_color_algorithm.sh
    pass_condition: |
      PASS=5  FAIL=0  (all 5 invariants: deterministic, valid colourNNN,
      palette member, spread ≥12/16, empty-fallback to system hostname)
    evidence: stdout transcript with hash + palette-index + colour
    severity: high

  - id: TMUX-CH-11
    title: hostname colour applied to tmux status-bg via wrapper
    description: |
      The tmx wrapper computes the hostname-derived colour and applies
      it as status-style bg on the running tmux server. The colour
      persists across sessions.
    test_script: scripts/tests/11_hostname_color_integration.sh
    pass_condition: |
      tmx wrapper contains _apply_host_color + hostname_color.sh ref;
      status-style bg matches expected hostname colour on first and
      subsequent sessions
    evidence: 'show -g status-style' output matched to hostname_color.sh result
    severity: high

  - id: TMUX-CH-16
    title: window-name strips `.exe` suffix (operator-path)
    description: |
      Some bundled CLIs ship Mach-O binaries literally named `*.exe`
      (notably Claude Code v2.x at
      `lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe`). The
      kernel `comm` field carries the basename, so tmux's
      `#{pane_current_command}` reports `claude.exe`, which the default
      `automatic-rename-format` propagates into the window name shown
      in the bottom-left status bar — operators saw `[session] N:claude.exe`.
      The fix patches `scripts/tmux.conf.template` to strip a literal
      `.exe` tail from the rename format. Tested via the OPERATOR PATH
      (`tmx new -s NAME` + an in-test `.exe` binary), per §11.4.7. A
      regression guard binary `t16_bashexe` (no dot, but containing
      `exe`) MUST survive unmodified — preventing the unescaped-dot
      bug class from shipping silently.
    test_script: scripts/tests/16_window_name_strips_exe.sh
    pass_condition: |
      PASS=6  FAIL=0  (T1 conf-template carries literal-dot-anchored
      `\\.exe$`; T2.0 operator-path session A created; T2.1
      pane_current_command observed as `t16_target.exe`; T2.2 #W
      has .exe stripped; T3.0 session B created; T3.1 regression
      guard `t16_bashexe` preserved as-is)
    evidence: |
      live `tmux -L tmx-NAME display-message -p '#W'` reads from
      both sessions; positive proof pane_current_command had the
      `.exe` form (defect surface reachable); strip applied to
      the `.exe` case only.
    severity: high

  - id: TMUX-CH-17
    title: scrollback + copy-mode scrolling works (operator-path)
    description: |
      Operators reported that scrolling terminal output up/down — in
      particular inside the Claude Code TUI — did not work. Two root
      causes: the history-limit default (2000) was too small, and tmux's
      default WheelUpPane binding forwards the wheel to mouse-reporting
      apps (Claude Code, vim, less) instead of scrolling tmux's own
      scrollback. The fix (Fixed.md A16) bumps history-limit to 50000,
      sets mode-keys vi, overrides WheelUp/WheelDown so the wheel ALWAYS
      drives copy-mode scrollback, and adds the Claude Code passthrough
      settings (allow-passthrough on, extended-keys on,
      terminal-features extkeys). Verified via the OPERATOR PATH
      (`tmx new -s NAME`) per Constitution §102: a 3000-line stream is
      generated (deliberately > the old 2000 default, < the new 50000),
      the first line is proven to have scrolled off the visible screen,
      then the operator is proven able to scroll back to it via
      copy-mode and copy it.
    test_script: scripts/tests/17_scrollback_copy_mode.sh
    pass_condition: |
      FAIL=0. T1 conf-template carries all six scroll settings; T2 reads
      back history-limit=50000 / mode-keys=vi / mouse=on /
      allow-passthrough=on / extended-keys=on from the LIVE server;
      T3 confirms the live WheelUpPane binding drives copy-mode scroll-up
      (override active, not tmux default); T4 generates 3000 lines,
      proves SCROLLMARK_FIRST left the visible screen (defect surface
      real), proves the scrollback buffer retained it (history-limit
      bump functional — would be evicted at the old 2000 default), and
      proves copy-mode reached + copied it.
    evidence: |
      live `tmux -L tmx-NAME show-options` readbacks; `list-keys -T root
      WheelUpPane` output; `capture-pane -p` (visible) vs `capture-pane
      -p -S -` (full history); `#{scroll_position}` after a copy-mode
      search; `show-buffer` carrying SCROLLMARK_FIRST.
    severity: high

  - id: TMUX-CH-18
    title: HelixConstitution inheritance is wired and verified
    description: |
      The project's universal governance (anti-bluff covenant, data
      safety, memory budget, continuation-document invariant) is
      inherited from the HelixConstitution submodule at `constitution/`.
      This Challenge proves the inheritance is REAL, not merely claimed:
      the submodule is present + initialized, `.gitmodules` records it
      with an SSH URL, the §11.4 End-user Quality Guarantee anchor
      physically exists in `constitution/Constitution.md`, the verbatim
      anti-bluff user mandate is present, and every project governance
      doc (Constitution.md / CLAUDE.md / AGENTS.md / QWEN.md) carries
      its inheritance pointer. The `constitution/` submodule is
      decoupled and independent — this gate READS it but never modifies
      it; the paired mutation (CM-CONSTITUTION-INHERITANCE) operates on
      a temporary copy.
    test_script: scripts/tests/18_constitution_inheritance.sh
    pass_condition: |
      FAIL=0. T1 submodule populated; T2 .gitmodules carries the
      constitution entry with an SSH URL; T2b submodule initialized;
      T3 §11.4 anchor present in constitution/Constitution.md; T4
      verbatim anti-bluff mandate present; T5–T9 project Constitution /
      CLAUDE / AGENTS / QWEN all carry inheritance pointers plus the
      §101 project anti-bluff binding.
    evidence: |
      file-content greps of constitution/Constitution.md (the exact
      §11.4 sentinel line) + .gitmodules + `git submodule status` +
      each project governance doc.
    severity: blocker

  - id: TMUX-CH-19
    title: Verbatim anti-bluff covenant propagation across governance files
    description: |
      Forensic anchor — user mandate (2026-05-21): the verbatim
      2026-04-28 anti-bluff covenant MUST be literally present in every
      consumer governance file (project Constitution.md, CLAUDE.md,
      AGENTS.md, QWEN.md), not only reachable through the @import
      pointer. Any tool that does not expand @imports still reads the
      covenant. This Challenge proves the propagation by reading file
      CONTENT (positive evidence per §11.4.2) — never on file existence
      alone. The paired mutation (M15) strips the literal from a TEMP
      COPY of CLAUDE.md and asserts test 19 FAILs; the real CLAUDE.md is
      never modified.
    test_script: scripts/tests/19_covenant_propagation.sh
    pass_condition: |
      FAIL=0. T1 Constitution.md, T2 CLAUDE.md, T3 AGENTS.md, T4
      QWEN.md all carry the verbatim "We had been in position that all
      tests do execute with success…" anchor literally. T5 all four
      consumer files reference §11.4 / §101 canonical authority. T6
      upstream constitution/Constitution.md retains the same anchor
      (composition check). T7 governance HTML+PDF siblings in sync per
      §11.4.65 universal-Markdown-export.
    evidence: |
      file-content greps of each consumer governance doc + composition
      grep of constitution/Constitution.md + mtime parity check of the
      .html + .pdf siblings.
    severity: blocker

  - id: TMUX-CH-20
    title: CodeGraph CLI installed and initialised
    description: |
      Per §11.4.78 (CodeGraph code-intelligence mandate): every project
      worked on by AI coding agents MUST install CodeGraph (npm
      `@colbymchenry/codegraph`) and run `codegraph init` + `codegraph
      index`. This Challenge proves the CLI is on PATH, the
      `.codegraph/config.json` exists, secret-exclusion paths per
      §11.4.10 are present, and `.codegraph/codegraph.db` (the SQLite
      knowledge graph) is materialised and non-empty.
    test_script: scripts/tests/20_codegraph_installed.sh
    pass_condition: |
      FAIL=0. T1 `codegraph --version` ≥ 0.6.0; T2 `.codegraph/
      config.json` exists; T3 secret-exclusion patterns (.env*, *.pem,
      *.key, secrets/, constitution/, Containers/, tmux/) present in
      config exclude list; T4 .gitignore covers `.codegraph/codegraph.db`
      and friends; T5 `.gitignore-meta/codegraph-db.yaml` declares the
      §11.4.77 regeneration mechanism.
    evidence: |
      `codegraph --version` stdout; `cat .codegraph/config.json`;
      `grep .gitignore`; file presence of regeneration metadata.
    severity: blocker

  - id: TMUX-CH-21
    title: CodeGraph index present + non-empty
    description: |
      Building on TMUX-CH-20, this Challenge proves the SQLite knowledge
      graph is actually built (not just configured). The index node
      count is captured as positive runtime evidence — the same fact a
      §11.4.78 unforgeable challenge would query via the MCP server.
    test_script: scripts/tests/21_codegraph_index_present.sh
    pass_condition: |
      FAIL=0. T1 `.codegraph/codegraph.db` file present; T2 file size
      > 4 KB (non-empty SQLite); T3 `codegraph status` reports a
      non-zero node count.
    evidence: |
      `ls -la .codegraph/codegraph.db`; `codegraph status` stdout
      capture; node-count integer extracted.
    severity: blocker

  - id: TMUX-CH-22
    title: CodeGraph MCP wired for every CLI agent we support
    description: |
      Per §11.4.78 + user mandate (2026-05-21): CodeGraph MCP server
      must be configured for Claude Code (project-scoped `.mcp.json`),
      OpenCode (`~/.config/opencode/opencode.json`), Kimi CLI
      (`~/.kimi/mcp.json`), Crush (`.crush.json`), Qwen Code
      (`.qwen/settings.json`). Per-agent SKIP-with-reason when the
      agent binary isn't installed on the host (§11.4.3 topology
      dispatch).
    test_script: scripts/tests/22_codegraph_mcp_wired.sh
    pass_condition: |
      FAIL=0. For each agent: config file exists OR is documented as
      "agent not installed on this host" SKIP; if present, codegraph
      MCP server entry resolvable via JSON parse; `command` field
      references the bare `codegraph` on PATH (no hardcoded host paths).
    evidence: |
      JSON parse of each config; bare-PATH command field captured;
      SKIP-reasons for absent agents recorded per §11.4.3.
    severity: high

  - id: TMUX-CH-23
    title: tmx kill shorthand resolves to kill-session (AUDIT-2 fix)
    description: |
      README/AGENTS commands table lists `tmx {new|attach|ls|kill}` as
      the friendly verb set. Pre-AUDIT-2 the wrapper passed `kill`
      through to tmux, which reported "ambiguous command: kill" because
      tmux only knows `kill-pane`/`kill-server`/`kill-session`/`kill-
      window`. This Challenge proves the wrapper translates the bare
      `kill` verb to `kill-session` so the documented operator-path
      actually works.
    test_script: scripts/tests/23_tmx_kill_shorthand.sh
    pass_condition: |
      FAIL=0. T1 create a session via `tmx new -s NAME -d`; T2
      `tmx ls` shows it; T3 `tmx kill -t NAME` resolves cleanly (no
      "ambiguous command" stderr); T4 `tmx ls` no longer shows the
      session.
    evidence: |
      `tmx ls` before + after; `tmx kill -t NAME` exit code + stderr;
      `tmux -L tmx-NAME ls` confirms server gone.
    severity: medium

  - id: TMUX-CH-24
    title: Per-platform CPU-cap enforcement (§11.4.81 (C) adjacent test)
    description: |
      Per the new constitution §11.4.81 cross-platform-parity mandate
      (universal anchor pushed `6e164f3`): every Linux-only test must
      have a platform-correct equivalent. Linux test 12 (memory
      pressure under cgroup MemoryMax cap) has no direct macOS
      analogue — XNU does NOT enforce RLIMIT_AS / RLIMIT_DATA /
      RLIMIT_RSS for unprivileged processes (kernel limitation
      documented in docs/guide/README.md §5.6). Per §11.4.81 (C) the
      ADJACENT TEST exercises the closest invariant macOS CAN
      enforce: RLIMIT_CPU + SIGXCPU. This Challenge proves the macOS
      kernel actually fires SIGXCPU when a CPU-bound process exceeds
      its configured CPU-second budget, AND proves the wrapper
      propagates the operator's TMX_CPU_HARD_SEC override into
      RLIMIT_CPU inside the session.
    test_script: scripts/tests/24_cpu_cap_enforcement.sh
    pass_condition: |
      FAIL=0. Darwin: D-T1 — child bash with `ulimit -t 2` runs a
      CPU-bound loop and exits with rc=152 (= 128 + signal 24
      SIGXCPU) within ~3s wall (positive evidence: kernel-enforced
      RLIMIT_CPU). D-T2 — `TMX_CPU_HARD_SEC=7200 tmx new -s NAME -d`
      session shows `ulimit -t = 7200` inside the pane (positive
      evidence: wrapper-to-rlimit propagation). Linux: L-T1 — cgroup
      CPUQuota=10% bounds a CPU-bound loop, iteration count
      observably throttled vs unrestricted reference.
    evidence: |
      Darwin: probe exit code + wall time captured; ulimit -t
      readback via send-keys + capture-pane. Linux: cgroup iteration
      count vs unrestricted reference.
    severity: high

  - id: TMUX-CH-25
    title: tmx_session_resume_cwd — per-session last-cwd recall (P4 + P6)
    description: |
      Per v1.0.9 design spec §7 HelixQA Challenges: this Challenge proves
      the end-user-visible behaviour "I create a session named X again and
      it starts where I left it last time". Dispatches to test 27
      (scripts/tests/27_state_persistence.sh) which (a) exercises the
      Go state daemon's record→recall round-trip, (b) drives a real
      `tmx new -s NAME -d` session via the OPERATOR PATH per §102, (c)
      reads `pane_current_path` back from the live tmux server, (d)
      proves the cwd-capture hook fires on kill-session by overwriting
      state with a different cwd and re-recalling. PASS only when the
      captured `[evidence]` line carries `pane_path=<expected>` proving
      §11.4.5 captured-evidence. §11.4.50 reliability: the underlying
      test wraps 3 iterations + asserts identical evidence-hash; the
      Challenge inherits that contract. Paired mutation P5-M21 strips
      the cwd-capture tmux hook block from scripts/tmx.template — when
      the hook is gone, test 27 (and this Challenge) MUST FAIL.
    test_script: scripts/tests/27_state_persistence.sh
    pass_condition: |
      Test exit 0 AND stdout contains literal `[evidence]` line with
      `pane_path=<TARGET_DIR>` matching the recorded path AND
      `recall1=<TARGET_DIR>` AND `recall2=<hook_target>` (hook fired
      and overwrote state); 3/3 reliability iterations identical
      evidence-hash per §11.4.50.
    skip_conditions: |
      §11.4.3 topology dispatch: SKIP-77 if scripts/tmx-state-bin not
      present (Go binary not built — P1 not landed yet), OR if the
      generated wrapper lacks `tmx-state-bin` integration (operator
      hasn't re-run setup.sh after P4), OR if tmux binary unavailable,
      OR if HOST_OS is neither Linux nor Darwin.
    evidence: |
      stdout `[evidence]` lines per iteration with iter index,
      recall1 (round-trip), pane_path (live tmux readback), recall2
      (post-hook); HOST_OS + reliability_hash on final line.
    mutation_targets: P5-M21 (strip cwd-capture hook from tmx.template)
    severity: blocker

  - id: TMUX-CH-26
    title: tmx_ssh_dispatch_nezha — remote SSH dispatch (P3 + P6)
    description: |
      Per v1.0.9 design spec §5.2 + §7: an operator running
      `ssh nezha-tmx <session>` MUST land directly in that tmx session
      on the remote host. Dispatches to test 32
      (scripts/tests/32_ssh_dispatch_remote_nezha.sh) which (a) probes
      nezha reachability via BatchMode SSH, (b) verifies the operator's
      ~/.ssh/config carries the dispatcher alias, (c) backgrounds an
      ssh-via-alias call with the session name, (d) verifies via a
      SECOND ssh that `tmx ls` on the remote lists the session — the
      POSITIVE sink-side captured-evidence per §11.4.5 + §11.4.68
      (positive sink-side evidence — the remote listing IS the
      downstream evidence). §11.4.50 reliability: 3 iterations,
      identical evidence-hash. Paired mutation P5-M22 strips the
      `command=` clause from the authorized_keys template — when the
      command restriction is gone, the dispatcher does not run and
      the session is never created on the remote, so this Challenge
      MUST FAIL.
    test_script: scripts/tests/32_ssh_dispatch_remote_nezha.sh
    pass_condition: |
      Test exit 0 AND stdout contains `[evidence] listed='<SESS>:'`
      lines per iteration proving the remote `tmx ls` showed the
      dispatched session; 3/3 reliability iterations identical
      evidence-hash per §11.4.50.
    skip_conditions: |
      §11.4.3 topology dispatch: SKIP-77 if TMX_TEST_REMOTE=1 not
      set (opt-in network-heavy), OR if nezha unreachable via
      BatchMode SSH, OR if normal SSH command execution fails
      (pre-existing infra), OR if ~/.ssh/config alias is not
      configured (operator hasn't run tmx-ssh-install.sh yet).
    operator_block_details: |
      §11.4.21 Operator-Block-Details (applies when ALL self-resolution
      paths exhausted but Challenge still cannot run):
      WHAT: Operator must (a) ensure nezha.local resolvable from the
        running host, (b) run scripts/tmx-ssh-install.sh to provision
        ~/.ssh/config alias + remote authorized_keys, (c) set env
        var TMX_TEST_REMOTE=1 (and optionally TMX_TEST_REMOTE_HOST,
        TMX_TEST_REMOTE_ALIAS to override defaults).
      WHY: BatchMode SSH probe to nezha is the SOLE means to verify
        the dispatcher round-trip end-to-end; mocking ssh would be a
        §11.4.27 no-fakes-beyond-unit-tests violation; no captured
        recording can substitute for a live remote tmux session
        listing (§11.4.13 out-of-band sink-side evidence).
      UNBLOCK CONDITION: `ssh -o BatchMode=yes -o ConnectTimeout=3
        milosvasic@nezha.local exit` returns 0 AND
        `ssh -G nezha-tmx | grep -qi '^hostname '` succeeds AND
        TMX_TEST_REMOTE=1 in environment.
