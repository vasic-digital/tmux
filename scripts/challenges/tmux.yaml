      v1.0.15 adds `bind -n M-MouseDrag1Pane copy-mode -M` AND
      `bind -n S-MouseDrag1Pane copy-mode -M` so EITHER Alt+drag
      or Shift+drag forces tmux to take the drag for selection.
      Matching drag-end bindings route the selection through
      @clip. This Challenge proves all 4 bindings exist on the
      live server AND survive the mouse_any_flag=1 surface, AND
      that the keyboard-equivalent of the modifier-drag flow
      lands 6 markers in the OS clipboard.
